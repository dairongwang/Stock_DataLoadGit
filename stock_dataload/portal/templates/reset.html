{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:30px auto">
  <h1>Choose a new password</h1>
  <p class="muted">for <b>{{ email }}</b></p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('reset_password', token=token) }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="form-grid" style="grid-template-columns:160px 1fr">
      <label for="password">New password</label><input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" autofocus>
      <span class="help">at least 8 characters</span>
      <label for="password_confirm">Repeat password</label><input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
    </div>
    <div class="actions"><button type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
