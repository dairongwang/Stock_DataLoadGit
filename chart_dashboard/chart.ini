; =====================================================================
;  stock_chart - the standalone chart dashboard
;  Relative paths are resolved against the folder containing this file.
;  Environment variables win: STOCK_CHART_DB, STOCK_CHART_HOST, STOCK_CHART_PORT,
;  STOCK_CHART_PASSWORD (and STOCK_CHART_CONFIG chooses this file).
; =====================================================================

[database]
; the SQLite database the data pipeline writes (opened READ-ONLY)
sqlite_path = ../data/stock_trade.db
; the daily table: Ticker, TradeDate, Market, Open, High, Low, Close, Volume
daily_table = Stock_Daily
; the weekly / monthly aggregates of the pipeline ('promote weekly' / 'promote monthly') - optional,
; see [chart] period_source
weekly_table = Stock_Weekly
monthly_table = Stock_Monthly

[lists]
; the watchlist, the Selected list and the screen lists are saved in the tables Chart_List / Chart_List_Item
; of this SQLite file - empty = the database above (the dashboard then needs write access to it; the stock
; tables are still only read). Or set $STOCK_CHART_LISTS_DB.
sqlite_path = 

[server]
; 127.0.0.1 = this machine only; use 0.0.0.0 behind a reverse proxy (and consider [auth])
host = 127.0.0.1
port = 8070

[chart]
title = Stock chart
; ticker shown first (empty = the ticker with the most daily rows)
default_ticker = 
; period shown first: 1M 3M 6M YTD 1Y 5Y ALL
default_range = 6M
; the watchlist a browser starts with, comma separated, e.g. HD, JNJ, JPM, MRK, PFE (empty = every ticker with
; data); each browser then keeps its own list - users add / remove stocks on the page
watchlist = 
; one candle per: daily | weekly | monthly (the page has buttons to switch)
default_interval = daily
; weekly / monthly candles from: auto = the aggregate tables when they are up to date for the ticker, otherwise
; aggregated from the daily rows | tables = the aggregate tables only | daily = always aggregated from the daily rows
period_source = auto
; most recent candles one chart request returns (5000 trading days = about 20 years)
max_points = 5000
; the ticker list is cached this many seconds
ticker_cache_seconds = 60

[auth]
; none = open | basic = HTTP basic authentication
mode = none
username = dummy_chart_viewer
; the password is taken from $STOCK_CHART_PASSWORD only - never write it into this file

[logging]
; DEBUG | INFO | WARNING | ERROR
level = INFO
; rotating log file (empty = console only), e.g. logs/stock_chart.log
file = 
